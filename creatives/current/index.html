<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
  body{position:fixed;inset:0}   /* the page itself can never scroll (owner 20:02: the page scrolled under the thumb) */
  #stage,#gl,#cv{touch-action:none;-webkit-touch-callout:none}
  #stage{position:absolute;inset:0;margin:auto;aspect-ratio:2/3;height:min(100dvh,150vw);max-width:100vw;container-type:size}
  #gl,#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  #gl{background:#000}
  .card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;font-family:"Open Sans",sans-serif}
  .card.hidden{display:none}
  #start{background:linear-gradient(180deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.85) 100%)}
  .logo{width:52cqw;mix-blend-mode:screen;margin-bottom:1cqh}
  .live{display:inline-flex;align-items:center;gap:1.4cqw;background:#e8132b;font:400 4.6cqw "Bebas Neue",sans-serif;letter-spacing:.06em;padding:.5cqh 2.6cqw;border-radius:6px;margin-bottom:2.2cqh}
  .live i{width:2cqw;height:2cqw;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .line{white-space:pre-line;font:700 4.6cqw/1.35 "Open Sans",sans-serif;margin:0 8cqw 4cqh;text-shadow:0 2px 6px #000}
  .line b{color:#ff3b4f}
  .btn{font:400 7.4cqw "Bebas Neue",sans-serif;letter-spacing:.05em;border:0;border-radius:10px;padding:1.4cqh 10cqw;cursor:pointer;background:#3BEA1E;color:#041;box-shadow:0 .7cqh 0 #1d7a0c,0 0 4cqw rgba(59,234,30,.5);animation:pulse 1.4s ease-in-out infinite}
  .btn.ghost{background:transparent;color:#fff;border:3px solid #fff;box-shadow:none;animation:none;font-size:5.6cqw;padding:1cqh 7cqw}
  @keyframes pulse{50%{transform:scale(1.05)}}
  #end{background:#050505;overflow:hidden;display:block;--green:#3BEA1E;--pink:#FF2FB3;--red:#ff3b4f;animation:endIn .45s ease-out}
  @keyframes endIn{from{opacity:0;transform:scale(1.04)}}
  #end.hidden{display:none}
  #end:not(.lostc) .l3grade,#end:not(.lostc) .l3scan,#end:not(.lostc) .elost{display:none}
  #end.lostc .ewon,#end.lostc .conf{display:none}
  #end.lostc .scene{filter:saturate(.45) brightness(.62) contrast(1.1)}
  #end.lostc .w3sticker{border-color:var(--red);box-shadow:1.2cqw 1.2cqw 0 #6a0d18,0 2cqh 4cqh rgba(0,0,0,.5)}
  #end.lostc .w3sticker .v{color:var(--red);text-shadow:.6cqw 0 0 rgba(0,255,255,.35),-.6cqw 0 0 rgba(255,0,80,.6),0 0 3cqw rgba(255,40,60,.5);animation:glitch 1.6s steps(1) infinite}
  #end .w3row{display:flex}
  #end .l3again{background:#fff;color:#111;box-shadow:0 1cqh 0 #9a9a9a}
  #end .w2chat div{color:#fff}
  #end.lostc .w3row.ewon,#end:not(.lostc) .w3row.elost{display:none}
     art, the green CRT wolf from the countdown asset, the horizontal title lockup, GET TICKETS as the deck's CTA. A column layout: nothing overlaps. */
  
  .chip{display:flex;gap:1.6cqw}
  .chip b,.chip span{font:400 4.4cqw "Bebas Neue";letter-spacing:.12em;padding:.3cqh 2.2cqw;border-radius:4px}
  .chip b{background:#e8132b}.chip span{background:rgba(0,0,0,.55)}
